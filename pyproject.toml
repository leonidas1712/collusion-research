[project]
name = "collusion"
version = "0.1.0"
description = "Apart AI Collusion Research Sprint: recruitment between agents, seen from the target's activations"
requires-python = ">=3.11"
dependencies = [
    "modal>=1.6.2",
    "openai>=1.54",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collusion"]
